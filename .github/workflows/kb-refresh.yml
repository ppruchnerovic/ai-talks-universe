name: Refresh the catalogue

# Re-enumerates every playlist and channel in conferences.json and rebuilds the
# indexes. Transcripts are deliberately NOT fetched here: YouTube meters the
# caption endpoint per egress IP and blocks GitHub's ranges outright, so
# fetch_transcripts.py has to run on a real machine.
#
# This run PUSHES A BRANCH AND REPORTS; it does not commit to main, does not
# open a pull request, and does not publish. It used to commit and publish. On
# 2026-08-31 a scheduled run committed straight to main and wrote
# `channel: null` over ~4,540 talks, then force-pushed the result to gh-pages,
# so the degraded corpus was live before anyone saw it.
#
# The cause is that enumeration from a runner does not fail cleanly. YouTube
# throttles these ranges, and a throttled listing comes back with titles and
# durations and no uploader — a plausible number of hollow records, which
# sync_catalog.py then writes over good ones. Both existing backstops count
# videos (a source that returns empty keeps its cache; the corpus refuses to
# shrink 10% without --allow-shrink), so neither noticed.
#
# What the weekly run is genuinely good at is spotting newly posted videos, and
# that survives a review gate. So: refresh, diff the field coverage with
# refresh_report.py, and leave the branch and the table for a human to accept.
#
# The gate is the human reading that table, not the pull request object — which
# is why opening one is no longer attempted. See the last step.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"        # Mondays, 04:17 UTC
  push:
    branches: [main]
    paths:
      - "conferences.json"
      - "tools/**"
      - ".github/workflows/kb-refresh.yml"

permissions:
  contents: write

concurrency:
  group: kb-refresh
  cancel-in-progress: false

env:
  BRANCH: automation/kb-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # refresh_report.py compares the rebuilt corpus against the committed
          # one via `git show HEAD:data/talks.json`, so the blob has to be here.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: pip install --quiet yt-dlp

      - name: Check the registry against the curated list
        working-directory: tools
        run: python3 check_registry.py

      - name: Re-enumerate and rebuild
        working-directory: tools
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 sync_catalog.py --refresh
          # Descriptions and publish dates, but only where a key is configured:
          # the yt-dlp fallback is a full extraction per video and would both
          # take hours and get the runner blocked.
          if [ -n "$YOUTUBE_API_KEY" ]; then
            python3 enrich.py --limit 4000
            python3 sync_catalog.py
          fi
          python3 build_index.py

      - name: Is there anything to propose?
        id: changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Exit 2 means a field lost more of the corpus than the tolerance allows,
      # which is the throttled-enumeration signature. It is reported, never
      # enforced here: the report is the thing a reviewer reads, and a run that
      # found real new talks alongside a regression should still be visible.
      - name: Field-coverage report
        id: report
        if: steps.changed.outputs.changed == 'true'
        working-directory: tools
        run: |
          # Written outside the tree so it never lands in the commit.
          set +e
          python3 refresh_report.py -o /tmp/refresh-report.md
          rc=$?
          set -e
          case "$rc" in
            0) echo "regressed=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "regressed=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "refresh_report.py failed ($rc)" >&2; exit "$rc" ;;
          esac

      # No pull request is opened here, and the permission to open one is not
      # requested. The built-in GITHUB_TOKEN is refused — `GraphQL: GitHub
      # Actions is not permitted to create or approve pull requests
      # (createPullRequest)` — and because that refusal came *after* the push,
      # every run since the gate was added ended red with the branch pushed and
      # the coverage table discarded. The branch and the table are the gate; a
      # PR object never was. So: push, write the table into the run summary,
      # and leave a compare link for whoever reviews it.
      - name: Push the branch and report
        if: steps.changed.outputs.changed == 'true'
        env:
          REGRESSED: ${{ steps.report.outputs.regressed }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One long-lived branch, rewritten each week, rather than a new one
          # every Monday that nobody deletes.
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Refresh the AI talk catalogue"
          git push --force origin "$BRANCH"

          if [ "$REGRESSED" = "true" ]; then
            heading="## 🔴 Catalogue refresh — field coverage regressed"
            note=$'> [!CAUTION]\n> A field lost more of the corpus than the tolerance allows. That is the\n> signature of a throttled enumeration overwriting good records, not of new\n> information. Read the table before merging.'
          else
            heading="## Catalogue refresh"
            note=$'> [!NOTE]\n> No field regressed. Merging publishes: `pages.yml` mirrors `main` into\n> `gh-pages` on push.'
          fi

          {
            printf '%s\n\n%s\n\n' "$heading" "$note"
            cat /tmp/refresh-report.md
            printf '\nPushed to `%s` — review it at\n%s/%s/compare/main...%s\n' \
              "$BRANCH" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$BRANCH"
            printf '\nOpen a pull request from that page if it is worth merging.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # Publishing happens only when a human merges that branch: a push to main
      # runs pages.yml, which mirrors main into gh-pages. Nothing here touches
      # main or gh-pages, so a throttled run cannot put degraded data on the
      # live site before somebody has looked at it.
