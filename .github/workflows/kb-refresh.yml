name: Refresh the catalogue

# Re-enumerates every playlist and channel in conferences.json and rebuilds the
# indexes. Transcripts are deliberately NOT fetched here: YouTube meters the
# caption endpoint per egress IP and blocks GitHub's ranges outright, so
# fetch_transcripts.py has to run on a real machine.
#
# This run OPENS A PULL REQUEST; it does not commit to main, and it does not
# publish. It used to do both. On 2026-08-31 a scheduled run committed straight
# to main and wrote `channel: null` over ~4,540 talks, then force-pushed the
# result to gh-pages, so the degraded corpus was live before anyone saw it.
#
# The cause is that enumeration from a runner does not fail cleanly. YouTube
# throttles these ranges, and a throttled listing comes back with titles and
# durations and no uploader — a plausible number of hollow records, which
# sync_catalog.py then writes over good ones. Both existing backstops count
# videos (a source that returns empty keeps its cache; the corpus refuses to
# shrink 10% without --allow-shrink), so neither noticed.
#
# What the weekly run is genuinely good at is spotting newly posted videos, and
# that survives a review gate. So: refresh, diff the field coverage with
# refresh_report.py, and put the result in a PR for a human to accept.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"        # Mondays, 04:17 UTC
  push:
    branches: [main]
    paths:
      - "conferences.json"
      - "tools/**"
      - ".github/workflows/kb-refresh.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kb-refresh
  cancel-in-progress: false

env:
  BRANCH: automation/kb-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # refresh_report.py compares the rebuilt corpus against the committed
          # one via `git show HEAD:data/talks.json`, so the blob has to be here.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: pip install --quiet yt-dlp

      - name: Check the registry against the curated list
        working-directory: tools
        run: python3 check_registry.py

      - name: Re-enumerate and rebuild
        working-directory: tools
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 sync_catalog.py --refresh
          # Descriptions and publish dates, but only where a key is configured:
          # the yt-dlp fallback is a full extraction per video and would both
          # take hours and get the runner blocked.
          if [ -n "$YOUTUBE_API_KEY" ]; then
            python3 enrich.py --limit 4000
            python3 sync_catalog.py
          fi
          python3 build_index.py

      - name: Is there anything to propose?
        id: changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Exit 2 means a field lost more of the corpus than the tolerance allows,
      # which is the throttled-enumeration signature. It is reported, never
      # enforced here: the report is the thing a reviewer reads, and a run that
      # found real new talks alongside a regression should still be visible.
      - name: Field-coverage report
        id: report
        if: steps.changed.outputs.changed == 'true'
        working-directory: tools
        run: |
          # Written outside the tree so it never lands in the commit.
          set +e
          python3 refresh_report.py -o /tmp/refresh-report.md
          rc=$?
          set -e
          case "$rc" in
            0) echo "regressed=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "regressed=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "refresh_report.py failed ($rc)" >&2; exit "$rc" ;;
          esac
          cat /tmp/refresh-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGRESSED: ${{ steps.report.outputs.regressed }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One long-lived branch and one open PR, rewritten each week, rather
          # than a new PR every Monday that nobody closes.
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Refresh the AI talk catalogue"
          git push --force origin "$BRANCH"

          if [ "$REGRESSED" = "true" ]; then
            title="🔴 Catalogue refresh — field coverage regressed"
            note=$'> [!CAUTION]\n> A field lost more of the corpus than the tolerance allows. That is the\n> signature of a throttled enumeration overwriting good records, not of new\n> information. Read the table before merging.\n\n'
          else
            title="Catalogue refresh"
            note=$'> [!NOTE]\n> No field regressed. Merging publishes: `pages.yml` mirrors `main` into\n> `gh-pages` on push.\n\n'
          fi

          {
            printf '%s' "$note"
            cat /tmp/refresh-report.md
            printf '\n---\n\nOpened by `kb-refresh.yml` from [run %s](%s/%s/actions/runs/%s). ' \
              "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'This workflow does not commit to `main`.\n'
          } > /tmp/pr-body.md

          n=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh pr edit "$n" --title "$title" --body-file /tmp/pr-body.md
            echo "Updated PR #$n"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "$title" --body-file /tmp/pr-body.md \
              $([ "$REGRESSED" = "true" ] && echo --draft)
          fi

      # Publishing now happens only when the PR is merged: a push to main runs
      # pages.yml, which mirrors main into gh-pages. Nothing here touches
      # gh-pages, so a throttled run can no longer put degraded data on the
      # live site before a human has looked at it.
